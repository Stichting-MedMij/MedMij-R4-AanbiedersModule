- action: parse
  name: parse-fhir-resources 
  status: "Checking if all FHIR Resource files can be parsed"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
    - "!feed.config.json"
    - "!**/node_modules/**"
    - "!validator/advisor.json"
    - "!fhirpkg.lock.json"
    - "!fsh-generated/data/**"
    - "!fsh-generated/data/fsh-index.json"

# Validate all resources
- action: validate
  name: validate-resources
  # The ImplementationGuide resource is not really used. It gives two errors... Therefore let's exclude it.
  # Logical models are excluded because their hyphenated IDs cause eld-20 false positives (element path
  # root inherits the id, and the eld-20 constraint requires alphanumeric-only path segments).
  filter: ImplementationGuide.exists().not() and StructureDefinition.where(kind = 'logical').exists().not()
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
    - "!feed.config.json"
    - "!**/node_modules/**"
    - "!validator/advisor.json"
    - "!fhirpkg.lock.json"
    - "!fsh-generated/data/**"
    - "!fsh-generated/data/fsh-index.json"
  status: "Validating all resources with .NET validator"
  

- name: id-mandatory
  error: http://medmij.nl/fhir/qa/errors|id-mandatory
  status: "Checking if all resources have an id"
  predicate: id.exists()
  files:
    - /**/*.xml
    - /**/*.json
  error-message: "Resource must have an id"

## Check ids except for logical models.
- name: id-valid
  status: "Checking if all resources have valid ids"
  predicate: id.matches('^[A-Za-z0-9\\-\\.]{1,64}$')
  filter: StructureDefinition.where(kind = 'logical').exists().not()
  error-message: The resource must have a valid id

- name: id-unique-profiles
  error: http://medmij.nl/fhir/qa/errors|id-unique-profiles
  status: "Checking if all profiles resources have a unique id"
  filter: StructureDefinition.exists()
  unique: id
 
- name: id-unique-examples
  error: http://medmij.nl/fhir/qa/errors|id-unique-examples
  status: "Checking if all examples have a unique id"
  category: example
  unique: id
 
- name: id-format-starts-with-ht
  error: http://medmij.nl/fhir/qa/errors|id-format-starts-with-ht
  status: "Checking if all profiles start with 'ht-'"
  category: conformance
  predicate: id.startsWith('ht-')
  files: 
    - "!guides/firely-sample-ig/ImplementationGuide.json"
 
- name: url-unique
  error: http://medmij.nl/fhir/qa/errors|url-unique
  status: "Checking if all resources have a unique url"
  filter: (StructureDefinition or ValueSet or CodeSystem or CapabilityStatement or SearchParameter or ConceptMap).exists()
  unique: url
  # custom error messages for unique checks do not work.
 
- name: url-starts-with-correct-base
  error: http://medmij.nl/fhir/qa/errors|url-starts-with-correct-base
  status: "Checking if all resources have a canonical URL that start with the correct base"
  filter: (StructureDefinition or ValueSet or CodeSystem or CapabilityStatement or SearchParameter or ConceptMap).exists()
  predicate: url.exists() and url.startsWith('http://medmij.nl/fhir/')
  error-message: "Resource canonical URL doesn't start with 'http://medmij.nl/fhir/'"  
  
- name: name-mandatory
  error: http://medmij.nl/fhir/qa/errors|name-mandatory
  error-message: "Resource does not have a name"
  status: "Checking if all conformance resources contain a name"
  filter: (StructureDefinition or ValueSet or CodeSystem or CapabilityStatement or SearchParameter or NamingSystem or ConceptMap).exists()
  predicate: name.exists()
 
- name: name-format-starts-with
  error: http://medmij.nl/fhir/qa/errors|name-format-starts-with
  error-message: "Resource does not a correct formatted name"
  status: "Checking if all conformance resources contain a proper name"
  category: conformance
  predicate: name.startsWith('Pt') or name.startsWith('Ext')
 
- name: title-mandatory
  error: http://medmij.nl/fhir/qa/errors|title-mandatory
  error-message: "Resource does not contain a title" 
  status: "Checking if all profiles contain a title"
  filter: StructureDefinition.exists()
  predicate: title.exists()
 
- name: description-mandatory
  error: http://medmij.nl/fhir/qa/errors|description-mandatory
  error-message: "Resource does not contain a description" 
  status: "Checking if resource contain a description"
  filter: (StructureDefinition or ValueSet or CodeSystem or CapabilityStatement or SearchParameter or NamingSystem or ConceptMap).exists()
  predicate: description.exists()
 
- name: publisher-filled
  error: http://medmij.nl/fhir/qa/errors|publisher-filled
  error-message: "Incorrect publisher info, should be 'MedMij'" 
  status: "Checking if all resources have 'MedMij' as publisher"
  filter: (StructureDefinition or ValueSet or CodeSystem or CapabilityStatement or SearchParameter or NamingSystem or ConceptMap).exists()
  predicate: publisher = 'MedMij'
 
- name: abstract-false
  error: http://medmij.nl/fhir/qa/errors|abstract-false
  error-message: "Resource has abstract = true" 
  status: "Checking if all profiles are not considered abstract"
  category: conformance
  predicate: abstract = false
 
- name: example-profile-mandatory
  error: http://medmij.nl/fhir/qa/errors|example-profile-mandatory
  error-message: "Example resource does not claim conformance to a profile" 
  status: "Checking if example has a meta.profile"
  category: example
  filter: (NamingSystem or ConceptMap).exists().not()
  files:
    - /**/*.xml
    - /**/*.json
  predicate: meta.profile.exists()
 
- name: example-reference-display
  error: http://medmij.nl/fhir/qa/errors|example-reference-display
  error-message: "Reference does not have a display value" 
  severity: warning
  status: "Checking if all References have a display value"
  category: example
  predicate: descendants().where($this.is(Reference)).all(display.exists() or extension.exists())
 
- name: example-reference-makeup
  error: http://medmij.nl/fhir/qa/errors|example-reference-makeup
  error-message: "Reference.reference is not absolute URL, relative URL or an internal fragment reference." 
  severity: warning
  status: "Checking if all literal References (Reference.reference) are an absolute URL, a relative URL or an internal fragment reference (contained)."
  category: example
  predicate: descendants().where($this.is(Reference)).reference.all(
                startsWith('http://') or
                startsWith('https://') or
                startsWith('#') or
                matches('^urn:oid:[0-2](\\.(0|[1-9]\\d*))*$') or
                matches('^urn:uuid:[A-Fa-f\\d]{8}-[A-Fa-f\\d]{4}-[A-Fa-f\\d]{4}-[A-Fa-f\\d]{4}-[A-Fa-f\\d]{12}$') or
                (startsWith('urn:').not() and startsWith('#').not() and matches('^[A-Za-z]{3,}/[^/]+$'))
                )
 
- name: example-codeableconcept-display-text
  error: http://medmij.nl/fhir/qa/errors|example-codeableconcept-display-text
  error-message: "CodeableConcept does not have a .coding.display or a .text value or an extension." 
  severity: warning
  status: "Checking if all CodeableConcept elements contain either a coding.display or a text value if no Coding exists or has an extension (e.g. a nullFlavor or data-absent-reason extension)."
  category: example
  predicate: descendants().where($this.is(CodeableConcept))
                .all(
                (coding.display.exists() or (coding.exists().not() and text.exists())) or extension.exists())
 